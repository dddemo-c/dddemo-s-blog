<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>加载中 · dddemo</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#fafafa;color:#1a1a2e;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ===== Container ===== */
.loader{
  text-align:center;
  user-select:none;
}

/* ===== Logo / Brand Mark ===== */
.brand{
  font-size:28px;font-weight:700;letter-spacing:-.04em;
  margin-bottom:48px;
  background:linear-gradient(135deg,#2563eb,#7c3aed 55%,#ec4899);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  position:relative;
}
.brand::after{
  content:'';
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:24px;height:2px;
  background:linear-gradient(90deg,transparent,#2563eb,transparent);
  border-radius:2px;
}

/* ===== Spinner Ring ===== */
.ring{
  position:relative;
  width:56px;height:56px;
  margin:0 auto 32px;
}
.ring svg{
  width:100%;height:100%;
  animation:spin 1.2s linear infinite;
}
.ring circle{
  fill:none;stroke-width:3;
  stroke:url(#grad);
  stroke-linecap:round;
  stroke-dasharray:140;
  stroke-dashoffset:360;
  animation:dash 1.4s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{
  0%{stroke-dasharray:1,280;stroke-dashoffset:0}
  50%{stroke-dasharray:140,280;stroke-dashoffset:-35}
  100%{stroke-dasharray:140,280;stroke-dashoffset:-280}
}

/* ===== Text ===== */
.status{
  font-size:15px;font-weight:500;letter-spacing:.02em;
  color:#94a3b8;margin-bottom:6px;
  animation:pulse 2s ease-in-out infinite;
}
.status-dots::after{content:'';animation:dots 1.8s steps(4,end) infinite}
@keyframes dots{
  0%,20%{content:''}
  40%{content:'.'}
  60%{content:'..'}
  80%{content:'...'}
  100%{content:''}
}
@keyframes pulse{
  0%,100%{opacity:.5}
  50%{opacity:1}
}

/* ===== Progress Bar ===== */
.progress-track{
  width:200px;height:3px;
  background:#e2e8f0;border-radius:4px;
  overflow:hidden;margin:16px auto 0;
}
.progress-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,#2563eb,#7c3aed 55%,#ec4899);
  border-radius:4px;
  animation:load 2.8s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes load{
  0%{width:0%;opacity:1}
  20%{width:18%}
  40%{width:35%}
  60%{width:55%}
  80%{width:78%}
  95%{width:94%}
  100%{width:100%;opacity:1}
}

/* ===== Footer Sub ===== */
.footer-text{
  margin-top:40px;
  font-size:12px;color:#cbd5e1;letter-spacing:.06em;
  text-transform:uppercase;
}

/* ===== Floating Particles ===== */
.particles{
  position:fixed;inset:0;pointer-events:none;overflow:hidden;
}
.particle{
  position:absolute;border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  opacity:0;
  animation:float 4s ease-in-out infinite;
}
.particle:nth-child(1){width:4px;height:4px;top:20%;left:15%;animation-delay:0s}
.particle:nth-child(2){width:3px;height:3px;top:65%;left:80%;animation-delay:.6s;background:linear-gradient(135deg,#7c3aed,#ec4899)}
.particle:nth-child(3){width:5px;height:5px;top:35%;left:75%;animation-delay:1.2s}
.particle:nth-child(4){width:3px;height:3px;top:75%;left:25%;animation-delay:1.8s;background:linear-gradient(135deg,#ec4899,#2563eb)}
.particle:nth-child(5){width:4px;height:4px;top:15%;left:60%;animation-delay:2.4s;background:linear-gradient(135deg,#7c3aed,#2563eb)}
@keyframes float{
  0%,100%{transform:translateY(0) scale(0);opacity:0}
  30%{opacity:.4}
  50%{transform:translateY(-20px) scale(1);opacity:.6}
  70%{opacity:.2}
  80%{transform:translateY(-40px) scale(.5);opacity:0}
}

/* ===== Responsive ===== */
@media(max-width:600px){
  .brand{font-size:22px;margin-bottom:36px}
  .ring{width:44px;height:44px}
  .progress-track{width:160px}
}
</style>
</head>
<body>

<div class="particles">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>

<div class="loader">
  <div class="brand">dddemo</div>
  <div class="ring">
    <svg viewBox="0 0 56 56">
      <circle cx="28" cy="28" r="22"/>
    </svg>
  </div>
  <div class="status">加载中<span class="status-dots"></span></div>
  <div class="progress-track">
    <div class="progress-bar"></div>
  </div>
  <div class="footer-text">— a quiet corner —</div>
</div>

</body>
</html>
