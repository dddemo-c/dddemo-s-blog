    <!-- Completely eliminate flash of wrong theme -->
    <script>
        (function() {
            const THEME_KEY = "REDEFINE-THEME-STATUS";
            const DARK = "dark", LIGHT = "light";
            
            // Get preferred theme
            function getTheme() {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved) {
                        const { isDark } = JSON.parse(saved);
                        return isDark ? DARK : LIGHT;
                    }
                } catch (e) {}
                
                return matchMedia("(prefers-color-scheme: dark)").matches ? DARK : LIGHT;
            }
            
            // Apply theme to document
            function applyTheme(theme) {
                const isDark = theme === DARK;
                const root = document.documentElement;
                
                // Set classes for compatibility
                root.classList.add(theme);
                root.classList.remove(isDark ? LIGHT : DARK);
                root.style.colorScheme = theme;
            }
            
            // Initial application
            const theme = getTheme();
            applyTheme(theme);
            
            // Listen for system preference changes
            matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ({ matches }) => {
                // Only update if using system preference (no localStorage entry)
                if (!localStorage.getItem(THEME_KEY)) {
                    applyTheme(matches ? DARK : LIGHT);
                }
            });
            
            // Set body classes ASAP (before DOMContentLoaded)
            (function() {
                const addBodyClass = () => {
                    const b = document.body;
                    if (!b) return false;
                    b.classList.add(theme + "-mode");
                    return true;
                };

                // Try immediately
                if (addBodyClass()) return;

                // Observe until body exists
                const mo = new MutationObserver(() => {
                    if (addBodyClass()) mo.disconnect();
                });
                mo.observe(document.documentElement, { childList: true, subtree: true });
            })();
        })();
    </script>

}

  <script>
  (function() {
    var loader = document.getElementById('loader');
    var canvas = document.getElementById('loaderCanvas');
    var ctx = canvas.getContext('2d');
    var W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Determine colors based on theme
    function isDark() {
      try {
        var saved = localStorage.getItem('REDEFINE-THEME-STATUS');
        if (saved) return JSON.parse(saved).isDark;
      } catch(e) {}
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    var dark = isDark();
    var particleColor = dark
      ? function() {
          var colors = ['99,140,255', '140,110,255', '200,140,230', '130,210,180'];
          return colors[Math.floor(Math.random() * colors.length)];
        }
      : function() {
          var colors = ['37,99,235', '124,58,237', '168,85,247', '59,130,246'];
          return colors[Math.floor(Math.random() * colors.length)];
        };

    if (dark) {
      document.documentElement.style.setProperty('--loader-bg', '#0f0f1a');
      document.documentElement.style.setProperty('--loader-text', '#e0def4');
    }

    // ---- Particles ----
    var particles = [];
    var COUNT = 40;

    for (var i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 2 + 0.5,
        color: particleColor(),
        alpha: Math.random() * 0.35 + 0.08
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, W, H);

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10;
        if (p.y > H + 10) p.y = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.color + ',' + p.alpha + ')';
        ctx.fill();

        // Subtle connections
        for (var j = i + 1; j < particles.length; j++) {
          var p2 = particles[j];
          var dx = p.x - p2.x;
          var dy = p.y - p2.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = 'rgba(' + p.color + ',' + (1 - dist / 100) * 0.06 + ')';
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // ---- Block scroll ----
    document.documentElement.style.overflow = 'hidden';

    // ---- Hide loader ----
    function hideLoader() {
      if (loader.classList.contains('hidden')) return;
      loader.classList.add('hidden');
      document.documentElement.style.overflow = '';
      setTimeout(function() {
        if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
      }, 700);
    }

    // Listen for full resource load
    if (document.readyState === 'complete') {
      setTimeout(hideLoader, 400);
    } else {
      window.addEventListener('load', function() {
        setTimeout(hideLoader, 400);
      });
    }

    // Fallback: hide after 6s
    setTimeout(function() {
      if (!loader.classList.contains('hidden')) hideLoader();
    }, 6000);
  })();
  </script>

<script>
(function() {
  var container = document.querySelector('.tag-detail-container');
  if (!container) return;
  
  var allPosts = JSON.parse(container.getAttribute('data-posts') || '[]');
  var subTags = JSON.parse(container.getAttribute('data-subtags') || '[]');
  var mainTag = container.getAttribute('data-tag-name') || '';
  var titleEl = document.getElementById('tagMainTitle');
  var countEl = document.getElementById('tagPostCount');
  var listEl = document.getElementById('tagPostList');
  
  // 当前筛选状态：null = 全部，否则是子标签名
  var currentFilter = null;

  function renderPosts(filterTag) {
    var filtered = allPosts;
    if (filterTag) {
      filtered = allPosts.filter(function(p) {
        return p.tags.indexOf(filterTag) !== -1;
      });
    }
    
    // 更新标题
    if (filterTag && filterTag !== mainTag) {
      var shortName = filterTag.split('/').pop();
      titleEl.textContent = mainTag + ' · ' + shortName;
    } else {
      titleEl.textContent = mainTag;
    }
    countEl.textContent = filtered.length + ' 篇文章';
    
    // 重建列表
    listEl.innerHTML = '';
    filtered.sort(function(a, b) { return b.date - a.date; });
    
    filtered.forEach(function(post) {
      var card = document.createElement('article');
      card.className = 'tag-post-card';
      
      var link = document.createElement('a');
      link.href = post.path;
      link.className = 'tag-post-link';
      
      var title = document.createElement('h2');
      title.className = 'tag-post-title';
      title.textContent = post.title;
      link.appendChild(title);
      
      var meta = document.createElement('div');
      meta.className = 'tag-post-meta';
      
      var time = document.createElement('time');
      time.className = 'tag-post-date';
      time.textContent = post.dateStr;
      meta.appendChild(time);
      
      var badges = document.createElement('div');
      badges.className = 'tag-post-badges';
      post.tags.forEach(function(t) {
        var badge = document.createElement('span');
        badge.className = 'tag-badge';
        badge.textContent = t;
        badges.appendChild(badge);
      });
      meta.appendChild(badges);
      link.appendChild(meta);
      
      if (post.excerpt) {
        var excerpt = document.createElement('p');
        excerpt.className = 'tag-post-excerpt';
        excerpt.textContent = post.excerpt;
        link.appendChild(excerpt);
      }
      
      card.appendChild(link);
      listEl.appendChild(card);
    });
    
    // 更新小标签 active 状态
    var subtagBtns = document.querySelectorAll('.tag-subtag');
    subtagBtns.forEach(function(btn) {
      btn.classList.remove('active');
      if ((!filterTag && btn.getAttribute('data-filter') === 'all') ||
          (filterTag && btn.getAttribute('data-filter') === filterTag)) {
        btn.classList.add('active');
      }
    });
  }

  // 绑定小标签点击
  document.querySelectorAll('.tag-subtag').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      var filter = this.getAttribute('data-filter');
      if (filter === 'all') {
        renderPosts(null);
      } else {
        renderPosts(filter);
      }
    });
  });
})();
</script>
